      - name: Build Web + Capacitor + APK
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          cd frontend
          npm install
          # 1. Build the web assets first
          npm run build
          # 2. Remove any existing android folder and create a fresh one
          rm -rf android
          npx cap add android
          # 3. CRITICAL: Replace Capacitor's default manifest with yours
          # This ensures CAMERA permission is included in the final APK.
          cp android-manifest-template.xml android/app/src/main/AndroidManifest.xml
          # 4. Sync the web assets into the native project
          npx cap sync
          # 5. Compile the APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
